app-tests-app-config-file: tests/test-values.yaml
app-tests-deploy-namespace: ate-system

upgrade-tests-app-catalog-url: https://giantswarm.github.io/giantswarm-catalog

# The pod mounts podCertificate projected volumes that only a cluster with
# Substrate's signers and the PodCertificateRequest feature gates can fill, so
# it never becomes Ready on the bare kind cluster app-test-suite creates. The
# chart's install is proven on an agentlab installation instead.
skip-steps: [smoke,functional,upgrade]
