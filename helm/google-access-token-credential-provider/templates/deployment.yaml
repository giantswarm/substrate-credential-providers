apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "labels.selector" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/namespace-policy: {{ toJson .Values.namespacePolicies | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "labels.common" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "name" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: provider
          image: {{ include "image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen-address=:50051
            - --health-address=:9090
            # The serving certificate for this Service's DNS name.
            - --server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
            # Only a caller whose certificate chains to the pod-identity bundle
            # and carries the egress gateway's SPIFFE ID is admitted.
            - --client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem
            - --injector-identity={{ include "injectorIdentity" . }}
            - --namespace-policy-file=/etc/google-access-token-credential-provider/namespace-policy.yaml
            - --exchange-timeout={{ .Values.exchangeTimeout }}
            - --log-level={{ .Values.logLevel }}
          {{- if or .Values.proxy.httpsProxy .Values.proxy.noProxy }}
          env:
            {{- with .Values.proxy.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ . | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: health
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: namespace-policy
              mountPath: /etc/google-access-token-credential-provider
              readOnly: true
            - name: servicedns
              mountPath: /run/servicedns.podcert.ate.dev
              readOnly: true
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
      volumes:
        - name: namespace-policy
          configMap:
            name: {{ include "name" . }}-namespace-policy
        # The serving certificate, issued for the Service that selects this pod.
        - name: servicedns
          projected:
            sources:
              - podCertificate:
                  {{- include "podCertificateMaxExpiration" . | nindent 18 }}
                  signerName: servicedns.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
        # The CA the egress gateway's client certificate chains to.
        - name: podidentity
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: podidentity.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
